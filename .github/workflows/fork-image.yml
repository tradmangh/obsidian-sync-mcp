name: Fork image (xpo)

# Fork-only: publishes ghcr.io/tradmangh/obsidian-sync-mcp for the xpo.at
# deployment (Bifrost /mcp/knowledge) without going through upstream's
# release/npm flow. Not part of any upstream PR.
#
# - push to a feature branch → :edge-<branch> and :sha-<short>  (for testing)
# - push to main             → :edge, :sha-<short>              (what VPS2 runs)
# Runs only after unit and e2e tests pass on the same commit.

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository_owner == 'tradmangh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx --yes oxlint@1.86.0 --deny-warnings src/
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  test-couchdb:
    if: github.repository_owner == 'tradmangh'
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3
        ports:
          - 5985:5984
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: test
        options: >-
          --health-cmd "curl -sf http://localhost:5984/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run test:couchdb

  image:
    needs: [test, test-couchdb]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - id: tags
        run: |
          short="${GITHUB_SHA::7}"
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tags=${img}:edge,${img}:sha-${short}" >> "$GITHUB_OUTPUT"
          else
            branch="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
            echo "tags=${img}:edge-${branch},${img}:sha-${short}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
